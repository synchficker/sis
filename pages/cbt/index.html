<!DOCTYPE html>
<html lang="id">
<head>
  <base href="../../">
  <script>window.__LS_PAGE__="cbt";</script>
  
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Online CBT — SIS Sekolah</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] } } } };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-600 flex items-center justify-center"><i data-lucide="timer" class="w-5 h-5"></i></div>
      <b class="text-sm flex-1">CBT — Computer Based Test</b>
      <span id="cbtTimer" class="hidden font-mono font-extrabold text-lg bg-rose-600 px-3 py-1 rounded-lg"></span>
      <a href="belajar.html" class="text-xs font-bold px-3 py-2 rounded-lg hover:bg-white/10">← E-Learning</a>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-6">
    <section id="scrPick">
      <h1 class="text-xl font-extrabold mb-1">Ujian Tersedia</h1>
      <p class="text-sm text-slate-500 mb-4">Masukkan NIS dan token ujian dari guru. Hasil otomatis dinilai; unduh berkas hasilnya untuk diserahkan ke guru.</p>
      <div id="uList" class="grid sm:grid-cols-2 gap-4"></div>
    </section>
    <section id="scrExam" class="hidden">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4 flex flex-wrap items-center gap-3">
        <div class="flex-1 min-w-[200px]"><b id="exJudul" class="text-sm"></b><div id="exPeserta" class="text-xs text-slate-500"></div></div>
        <div id="exNav" class="flex flex-wrap gap-1.5 max-w-xs"></div>
      </div>
      <div id="exSoal" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6"></div>
      <div class="flex justify-between mt-4">
        <button id="exPrev" class="px-4 py-2.5 rounded-xl border border-slate-300 font-bold text-sm bg-white hover:bg-slate-50">← Sebelumnya</button>
        <button id="exNext" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700">Berikutnya →</button>
        <button id="exDone" class="hidden px-5 py-2.5 rounded-xl bg-rose-600 text-white font-bold text-sm hover:bg-rose-700">Selesai & Nilai</button>
      </div>
    </section>
    <section id="scrHasil" class="hidden"></section>
  </main>
  <div id="jModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6">
      <b id="jTitle" class="text-lg font-extrabold"></b>
      <form id="jForm" class="mt-4 space-y-3">
        <label class="block"><span class="text-xs font-semibold text-slate-600">NIS *</span><input name="nis" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500"></label>
        <label class="block"><span class="text-xs font-semibold text-slate-600">Token Ujian *</span><input name="token" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 uppercase"></label>
        <label class="flex items-center gap-2 text-xs text-slate-600"><input type="checkbox" name="latihan" class="accent-emerald-600">Mode latihan (boleh mengulang)</label>
        <div class="flex gap-2 pt-2">
          <button type="button" id="jCancel" class="flex-1 py-2.5 rounded-xl border border-slate-300 font-bold text-sm">Batal</button>
          <button class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm">Mulai Ujian</button>
        </div>
      </form>
    </div>
  </div>
  <script src="config.js?v=20261129"></script>
  <script src="assets/js/app.js?v=20261129"></script>
  <script src="assets/js/cbt.js?v=20261129"></script>
</body>
</html>
