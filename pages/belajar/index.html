<!DOCTYPE html>
<html lang="id">
<head>
  <base href="../../">
  <script>window.__LS_PAGE__="belajar";</script>
  
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Learning — SIS Sekolah</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] } } } };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-emerald-700 text-white sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-white/15 flex items-center justify-center"><i data-lucide="book-open" class="w-5 h-5"></i></div>
      <div class="flex-1"><b id="bSchool" class="text-sm">E-Learning / Belajar Daring</b><div class="text-[11px] text-emerald-200">Materi • Video • Tugas • Ujian CBT</div></div>
      <a href="cbt.html" class="text-xs font-bold px-3 py-2 rounded-lg bg-white/15 hover:bg-white/25 inline-flex items-center gap-1.5"><i data-lucide="timer" class="w-4 h-4"></i>Ujian CBT</a>
      <a href="index.html" class="text-xs font-bold px-3 py-2 rounded-lg hover:bg-white/10">Beranda</a>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-wrap gap-3 items-end">
      <label class="block"><span class="text-xs font-semibold text-slate-600">Mata Pelajaran</span><select id="bMapel" class="mt-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">Semua</option></select></label>
      <label class="block"><span class="text-xs font-semibold text-slate-600">Kelas</span><select id="bKelas" class="mt-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">Semua</option></select></label>
      <label class="block"><span class="text-xs font-semibold text-slate-600">Tipe</span><select id="bTipe" class="mt-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">Semua</option><option>Materi</option><option>Video</option><option>Artikel</option><option>Link</option></select></label>
    </div>
    <section><h2 class="font-extrabold mb-3 flex items-center gap-2"><i data-lucide="book-open" class="w-5 h-5 text-emerald-600"></i>Materi & Video Belajar</h2><div id="bMateri" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></section>
    <section><h2 class="font-extrabold mb-3 flex items-center gap-2"><i data-lucide="clipboard-check" class="w-5 h-5 text-emerald-600"></i>Tugas Aktif</h2><div id="bTugas" class="space-y-3"></div></section>
  </main>
  <div id="vModal" class="hidden fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-3xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b"><b id="vTitle" class="text-sm"></b><button id="vClose" class="p-1.5 rounded-lg hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="aspect-video bg-black"><iframe id="vFrame" class="w-full h-full" allowfullscreen></iframe></div>
    </div>
  </div>
  <script src="config.js?v=20261129"></script>
  <script src="assets/js/app.js?v=20261129"></script>
  <script>
    let MATERI = [], TUGAS = [], ST = {};
    const icon = { Video: "video", Materi: "book-open", Artikel: "file-text", Link: "arrow-right" };
    function draw() {
      const mp = document.getElementById("bMapel").value, kl = document.getElementById("bKelas").value, tp = document.getElementById("bTipe").value;
      const rows = MATERI.filter(m => (!mp || m.mapel === mp) && (!kl || m.kelas === kl) && (!tp || m.tipe === tp));
      document.getElementById("bMateri").innerHTML = rows.map(m =>
        '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"><div class="flex items-center gap-2 text-xs font-bold text-emerald-700"><i data-lucide="' + (icon[m.tipe] || "book-open") + '" class="w-4 h-4"></i>' + esc(m.tipe) + " • " + esc(m.mapel) + " • " + esc(m.kelas) + '</div><b class="block mt-2 text-sm">' + esc(m.judul) + '</b><p class="text-xs text-slate-500 mt-1 line-clamp-2">' + esc(m.deskripsi || "") + "</p>" +
        (m.tipe === "Video"
          ? '<button data-play="' + esc(m.id) + '" class="mt-3 inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg bg-emerald-600 text-white"><i data-lucide="video" class="w-4 h-4 pointer-events-none"></i>Tonton</button>'
          : '<a target="_blank" href="' + esc(m.url || "#") + '" class="mt-3 inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50"><i data-lucide="arrow-right" class="w-4 h-4"></i>Buka Materi</a>') + "</div>"
      ).join("") || '<p class="text-sm text-slate-400 col-span-full">Belum ada materi untuk filter ini.</p>';
      refreshIcons();
      document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => {
        const m = MATERI.find(x => x.id === b.dataset.play);
        document.getElementById("vTitle").textContent = m.judul;
        document.getElementById("vFrame").src = ytEmbed(m.url);
        document.getElementById("vModal").classList.remove("hidden");
      });
    }
    document.getElementById("vClose").onclick = () => { document.getElementById("vFrame").src = ""; document.getElementById("vModal").classList.add("hidden"); };
    ["bMapel", "bKelas", "bTipe"].forEach(id => document.getElementById(id).onchange = draw);
    (async () => {
      try {
        [MATERI, TUGAS, ST] = await Promise.all([fetchJSON("materi.json"), fetchJSON("tugas.json"), fetchJSON("settings.json").catch(() => ({}))]);
        document.getElementById("bSchool").textContent = "E-Learning — " + (ST.nama_sekolah || "Sekolah");
        document.getElementById("bMapel").innerHTML += [...new Set(MATERI.map(m => m.mapel))].map(m => "<option>" + esc(m) + "</option>").join("");
        document.getElementById("bKelas").innerHTML += [...new Set(MATERI.map(m => m.kelas))].sort().map(m => "<option>" + esc(m) + "</option>").join("");
        draw();
        document.getElementById("bTugas").innerHTML = TUGAS.map(t => {
          const lewat = t.deadline && t.deadline < today();
          const waText = "Pengumpulan tugas " + t.judul + " (" + t.mapel + ", kelas " + t.kelas + "). Nama: … NIS: … (lampirkan foto/file jawaban)";
          return '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-wrap items-center gap-3"><div class="flex-1 min-w-[220px]"><b class="text-sm">' + esc(t.judul) + '</b><div class="text-xs text-slate-500">' + esc(t.mapel) + " • " + esc(t.kelas) + ' • Deadline: <b class="' + (lewat ? "text-rose-600" : "text-emerald-700") + '">' + fmtTgl(t.deadline) + (lewat ? " (lewat)" : "") + "</b></div>" + (t.deskripsi ? '<p class="text-xs text-slate-500 mt-1">' + esc(trunc(t.deskripsi, 140)) + "</p>" : "") + "</div>" +
            (t.lampiran ? '<a target="_blank" href="' + esc(t.lampiran) + '" class="text-xs font-bold px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50">Lampiran</a>' : "") +
            '<a target="_blank" href="https://wa.me/' + esc((ST.wa_admin || "").replace(/^0/, "62")) + "?text=" + encodeURIComponent(waText) + '" class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg bg-emerald-600 text-white"><i data-lucide="send" class="w-4 h-4"></i>Kumpul via WA</a></div>';
        }).join("") || '<p class="text-sm text-slate-400">Tidak ada tugas aktif.</p>';
      } catch (e) { toast(e.message, "error"); }
      refreshIcons();
    })();
  </script>
</body>
</html>
