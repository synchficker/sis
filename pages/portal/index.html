<!DOCTYPE html>
<html lang="id">
<head>
  <base href="../../">
  <script>window.__LS_PAGE__="portal";</script>
  
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Orang Tua — SIS Sekolah</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] } } } };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="font-sans bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-emerald-700 text-white sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-white/15 flex items-center justify-center"><i data-lucide="users" class="w-5 h-5"></i></div>
      <div class="flex-1 min-w-0"><b id="pSchool" class="text-sm truncate block">Portal Orang Tua</b><span class="text-[11px] text-emerald-200">Nilai • Absensi • SPP • Chat Wali Kelas</span></div>
      <a href="index.html" class="text-xs font-bold px-3 py-2 rounded-lg hover:bg-white/10">Beranda</a>
      <button id="pLogout" class="hidden text-xs font-bold px-3 py-2 rounded-lg bg-white/15 hover:bg-white/25">Keluar</button>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-6">
    <section id="pLogin" class="max-w-md mx-auto mt-8">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-7">
        <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center mb-4"><i data-lucide="graduation-cap" class="w-6 h-6"></i></div>
        <h1 class="text-xl font-extrabold">Masuk Portal Orang Tua</h1>
        <p class="text-sm text-slate-500 mt-1">Gunakan <b>NIS</b> dan <b>tanggal lahir</b> anak Anda. Tanpa token GitHub — akses baca saja.</p>
        <form id="fPortal" class="mt-5 space-y-3">
          <label class="block"><span class="text-xs font-semibold text-slate-600">NIS Siswa</span>
            <input name="nis" required placeholder="contoh: 2026001" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></label>
          <label class="block"><span class="text-xs font-semibold text-slate-600">Tanggal Lahir Siswa</span>
            <input name="ttl" type="date" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></label>
          <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">Masuk Portal</button>
        </form>
        <p class="text-[11px] text-amber-600 mt-3">Demo: NIS <b>2026001</b>, tanggal lahir <b>2013-05-10</b>. Catatan: situs statis tidak bisa menyimpan rahasia — verifikasi ini bersifat demo.</p>
      </div>
    </section>
    <section id="pApp" class="hidden">
      <div id="pHero" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4"></div>
      <nav id="pTabs" class="flex gap-2 overflow-x-auto pb-1 mb-4 text-sm font-bold"></nav>
      <div id="pBody"></div>
    </section>
  </main>
  <script src="config.js?v=20261128"></script>
  <script src="assets/js/app.js?v=20261128"></script>
  <script src="assets/js/portal.js?v=20261128"></script>
</body>
</html>
